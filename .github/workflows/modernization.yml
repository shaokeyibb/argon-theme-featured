name: Theme verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-release
          path: |
            temp/browser-*.png
            temp/browser-results/
            release/
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '6.6', php: '8.2' }
          - { wp: '7.0', php: '8.2' }
          - { wp: '7.0', php: '8.3' }
          - { wp: '7.0', php: '8.4' }
          - { wp: '7.0', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:php
        env:
          ARGON_TEST_PHP: ${{ matrix.php }}
          ARGON_TEST_WP: ${{ matrix.wp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.php }}-wp-${{ matrix.wp }}
          path: temp/*report*.json
